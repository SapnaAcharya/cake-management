services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cake-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  backend:
    build:
      context: ./CakeManagement.API/CakeManagement.API
      dockerfile: Dockerfile

    container_name: cake-backend

    ports:
      - "7092:8080"

    environment:

      # Environment (enables Swagger)
      ASPNETCORE_ENVIRONMENT: Development

      # Database
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${DB_NAME};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"

      # Admin
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Admin__Phone: ${ADMIN_PHONE}
      Admin__Address: ${ADMIN_ADDRESS}

      # JWT
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES_MINUTES}

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./cake-management-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:7092

    container_name: cake-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend


volumes:
  sqlserver_data: