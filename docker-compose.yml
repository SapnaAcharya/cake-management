services:

  # PostgreSQL Database
  db:
    image: postgres:17
    container_name: cake-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # ASP.NET Core Backend
  backend:
    build:
      context: ./CakeManagement.API/CakeManagement.API
      dockerfile: Dockerfile

    container_name: cake-backend

    ports:
      - "7092:8080"

    environment:

      ASPNETCORE_ENVIRONMENT: Development

      # PostgreSQL Database
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};"

      # Admin
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Admin__Phone: ${ADMIN_PHONE}
      Admin__Address: ${ADMIN_ADDRESS}

      # JWT
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES_MINUTES}

    depends_on:
      db:
        condition: service_healthy


  # React Frontend
  frontend:
    build:
      context: ./cake-management-frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: http://localhost:7092

    container_name: cake-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend


# Persistent PostgreSQL Storage
volumes:
  postgres_data: