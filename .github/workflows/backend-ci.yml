name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  backend-build:
    name: Build ASP.NET Core Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./CakeManagement.API/CakeManagement.API/CakeManagement.API.csproj

      - name: Build backend
        run: dotnet build ./CakeManagement.API/CakeManagement.API/CakeManagement.API.csproj --no-restore --configuration Release