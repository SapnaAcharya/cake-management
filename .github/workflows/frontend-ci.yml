name: Frontend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./cake-management-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./cake-management-frontend
        run: npm ci

      - name: Build React application
        working-directory: ./cake-management-frontend
        run: npm run build